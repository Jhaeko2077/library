    <title>Biblioteca</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #8b7e74, #6b5d54);
            min-height: 100vh;
            padding: 20px;
        }

        .insignia {
            position: fixed;
            width: 100px;
            height: 100px;
            opacity: 0.3;
            z-index: 1;
        }

        .insignia-left {
            top: 20px;
            left: 20px;
        }

        .insignia-right {
            top: 20px;
            right: 20px;
        }

        .hero {
            text-align: center;
            color: white;
            padding: 40px 20px;
            position: relative;
            z-index: 2;
        }

        .hero h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .hero h2 {
            font-size: 1.5em;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .hero p {
            font-size: 1.2em;
            opacity: 0.8;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            position: relative;
            z-index: 2;
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }

        .book-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(139, 126, 116, 0.3);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            text-align: center;
        }

        .book-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 5px 15px rgba(139, 126, 116, 0.3);
        }

        .book-card h3 {
            font-size: 1.8em;
            color: #8b7e74;
            margin-bottom: 15px;
        }

        .book-card p {
            color: #666;
            font-size: 1.1em;
            line-height: 1.6;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 40px;
            border-radius: 20px;
            max-width: 600px;
            position: relative;
            animation: slideDown 0.3s;
        }

        .modal-content-large {
            max-width: 900px;
            max-height: 80vh;
            overflow-y: auto;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .close-modal {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 35px;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close-modal:hover {
            color: #000;
        }

        .modal-title {
            color: #8b7e74;
            font-size: 2em;
            margin-bottom: 15px;
        }

        .modal-description {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #8b7e74 100%);
            color: white;
            padding: 15px 40px;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: bold;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }

        .search-bar {
            background: white;
            border-radius: 50px;
            padding: 10px 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .search-bar input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 1.1em;
            padding: 10px;
            background: transparent;
        }

        .pdf-list {
            margin-top: 30px;
        }

        .pdf-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 15px;
            transition: background 0.3s;
        }

        .pdf-item:hover {
            background: #f5f5dc;
        }

        .pdf-name {
            color: #333;
            font-size: 1.1em;
            flex-grow: 1;
        }

        .pdf-download-btn {
            background: linear-gradient(135deg, #667eea 0%, #8b7e74 100%);
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 25px;
            font-size: 0.95em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-left: 20px;
            white-space: nowrap;
        }

        .pdf-download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>

            { id: 40, name: "El aguatero estudiante", pdfUrl: "https://drive.google.com/file/d/1LDb82nWiaVzA0ovUdhLmlx1hccK5AScc/view?usp=sharing" },

            { id: 42, name: "El gran Gatsby – Francis Scott Fitzgerald", pdfUrl: "https://drive.google.com/file/d/1AD-wiSpIpFDbjrYJefYlXxQOkAdb_Gf7/view?usp=sharing" },
            { id: 43, name: "El libro de la selva", pdfUrl: "https://drive.google.com/file/d/1tfOqAHkq67VX8w19Jjeh-dsgOYacjh6t/view?usp=sharing" }
        ];

        function renderBooks() {
            const grid = document.getElementById('booksGrid');
            grid.innerHTML = '';
            
            books.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.onclick = () => openModal(book.type);
                
                card.innerHTML = `
                    <h3>${book.title}</h3>
                    <p>${book.description}</p>
                `;
                
                grid.appendChild(card);
            });
        }

        function renderPdfList(librosToRender = pdfLibros) {
            const list = document.getElementById('pdfList');
            list.innerHTML = '';
            
            librosToRender.forEach(libro => {
                const item = document.createElement('div');
                item.className = 'pdf-item';
                
                item.innerHTML = `
                    <span class="pdf-name">${libro.name}</span>
                    <button class="pdf-download-btn" onclick="downloadPdf('${libro.pdfUrl}')">Descargar PDF</button>
                `;
                
                list.appendChild(item);
            });
        }

        function openModal(type) {
            if (type === 'manual') {
                document.getElementById('modalManual').style.display = 'block';
            } else if (type === 'coleccion') {
                renderPdfList();
                document.getElementById('modalColeccion').style.display = 'block';
            }
        }

        function closeModalManual() {
            document.getElementById('modalManual').style.display = 'none';
        }

        function closeModalColeccion() {
            document.getElementById('modalColeccion').style.display = 'none';
        }

        window.onclick = function(event) {
            const modalManual = document.getElementById('modalManual');
            const modalColeccion = document.getElementById('modalColeccion');
            if (event.target === modalManual) {
                closeModalManual();
            }
            if (event.target === modalColeccion) {
                closeModalColeccion();
            }
        }

        function downloadPdf(url) {
            window.open(url, '_blank');
        }

        document.getElementById('searchPdf').addEventListener('input', e => {
            const term = e.target.value.toLowerCase();
            const filtered = pdfLibros.filter(libro => 
                libro.name.toLowerCase().includes(term)
            );
            renderPdfList(filtered);
        });

        renderBooks();
    </script>
</body>
</html>
